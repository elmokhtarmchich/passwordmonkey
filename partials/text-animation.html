<!-- Text Animation for H2 -->
<div class="relative bg-black rounded-lg p-4 border border-green-400">
  <span id="typed-text" class="font-mono font-bold text-4xl md:text-5xl lg:text-4xl xl:text-5xl text-green-400 tracking-wide leading-tight terminal-text">
    <span id="typed-content"></span><span id="cursor" class="inline-block w-3 h-6 bg-slate-900 dark:bg-slate-100 ml-1 animate-blink"></span>
  </span>
</div>

<style>
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .animate-blink {
    animation: blink 1s infinite;
  }
  .terminal-text {
    text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
    font-family: 'Courier New', monospace;
  }
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(0, 255, 0, 0.8) 50%,
      transparent 100%);
    animation: scanline 8s linear infinite;
    pointer-events: none;
  }
  .highlight-purple {
    color: #e2b6ff !important;
    background-color: rgba(147, 51, 234, 0.4);
    border: 1px solid rgba(192, 132, 252, 0.6);
    padding: 2px 8px;
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(192, 132, 252, 0.8);
    text-shadow: 0 0 8px rgba(192, 132, 252, 0.8);
  }
</style>

<script>
  const fullText = "Free Password Generator - Create Strong, Secure Passwords";
  const targetWords = ["Free", "Strong", "Secure"];
  const typedContent = document.getElementById("typed-content");
  const cursor = document.getElementById("cursor");

  let index = 0;
  const typingSpeed = 70; // Typing delay in ms

  function typeText() {
    if (index < fullText.length) {
      typedContent.textContent += fullText.charAt(index);
      index++;
      setTimeout(typeText, typingSpeed);
    } else {
      // Pause briefly after typing finishes, then apply the purple background highlight
      setTimeout(applyHighlights, 800);
    }
  }

  function applyHighlights() {
    let htmlResult = fullText;

    targetWords.forEach(function(word) {
      const regex = new RegExp('\\b(' + word + ')\\b', 'g');
      htmlResult = htmlResult.replace(regex, '<span class="highlight-purple">$1</span>');
    });

    typedContent.innerHTML = htmlResult;
  }

  // Start typing animation when the page loads
  window.addEventListener('DOMContentLoaded', typeText);
</script>
