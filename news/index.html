<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News - Password Monkey</title>
    <meta name="description" content="Latest password security updates, data breaches, and cybersecurity news curated by Password Monkey.">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="https://passwordmonkey.org/news/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://passwordmonkey.org/news/">
    <meta property="og:title" content="Password Security News | Password Monkey">
    <meta property="og:description" content="Latest password security updates, data breaches, and cybersecurity news curated by Password Monkey.">
    <meta property="og:image" content="https://passwordmonkey.org/images/og-image.png">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://passwordmonkey.org/news/">
    <meta name="twitter:title" content="Password Security News | Password Monkey">
    <meta name="twitter:description" content="Latest password security updates, data breaches, and cybersecurity news curated by Password Monkey.">
    <meta name="twitter:image" content="https://passwordmonkey.org/images/og-image.png">
    
    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="msapplication-TileColor" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PasswordMonkey News">
    <meta name="application-name" content="PasswordMonkey News">
    <meta name="format-detection" content="telephone=no">
    
    <!-- Structured Data - NewsPage Schema -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "NewsPage",
        "name": "Password Security News",
        "description": "Latest password security updates, data breaches, and cybersecurity news curated by Password Monkey.",
        "url": "https://passwordmonkey.org/news/",
        "mainEntity": {
            "@type": "ItemList",
            "name": "Password Security News Articles",
            "description": "Collection of password security and cybersecurity news articles"
        },
        "publisher": {
            "@type": "Organization",
            "name": "PasswordMonkey",
            "url": "https://passwordmonkey.org/",
            "logo": {
                "@type": "ImageObject",
                "url": "https://passwordmonkey.org/images/site_logo.png"
            }
        }
    }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!--#include virtual="/templates/navigation.html" -->
    
    <main class="news-container">
        <h1>Latest News</h1>
        <div class="articles-grid">
            <!-- Articles will be dynamically inserted here by the build script -->
        </div>
    </main>

    <!--#include virtual="/templates/footer.html" -->
</body>
</html>
