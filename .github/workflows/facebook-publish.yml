name: Facebook News Publisher

on:
  workflow_run:
    workflows: ["News Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview candidates without publishing"
        required: true
        default: true
        type: boolean
      post_limit:
        description: "Compatibility input; publishing is always capped at one article"
        required: true
        default: 1
        type: number

permissions:
  contents: write

concurrency:
  group: facebook-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      FACEBOOK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - name: Checkout news-pipeline commit
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Preview or publish new articles
        run: node automation/actions/facebook-publisher.mjs
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_POST_LIMIT: 1
          FACEBOOK_MAX_QUEUE_AGE_HOURS: 168

      - name: Commit publishing state
        if: always() && env.FACEBOOK_DRY_RUN == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/facebook-published.json automation/facebook-queue.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(news): record Facebook publications"
          git pull --rebase origin main
          git push origin HEAD:main
