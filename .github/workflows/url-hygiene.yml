name: URL Hygiene

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: url-hygiene
  cancel-in-progress: false

jobs:
  url-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run URL hygiene pipeline
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: node automation/actions/url-hygiene.mjs

      - name: Commit URL hygiene results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _redirects automation/url-hygiene.seen.json
          if git diff --staged --quiet; then
            echo "No URL hygiene changes to commit"
          else
            git commit -m "chore(hygiene): auto-heal bad URLs and record IndexNow pings"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
